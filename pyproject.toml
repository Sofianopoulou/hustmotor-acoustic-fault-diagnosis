[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hustmotor-acoustic-domain-generalization"
version = "1.0.0"
description = "Acoustic-only 1D CNN baseline for cross-speed HUSTmotor fault diagnosis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Apostolia Maria Sofianopoulou"}
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
